<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Warnings</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <h1 class="title">🟡🔴 Card Warnings</h1>
        <div class="table-card">
            <div class="table-container">
                <table id="cardTable" aria-label="Card warnings">
                    <thead>
                        <tr>
                            <th>Team</th>
                            <th>Player</th>
                            <th>🟡 Yellows</th>
                            <th>Ban Left</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        <p class="muted">Bans count down only when the player's team plays. Other teams' matches do not affect the ban.</p>
        <div class="btn-row">
            <button class="back-btn" onclick="location.href='index.html'">⬅ Back</button>
        </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="firebase.js"></script>
    <script src="script.js"></script>
</body>
</html>
