<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Champions</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;600&family=Barlow+Condensed:wght@400;600;700&display=swap');

        * { box-sizing: border-box; }
        body { background: #04080f; overflow-x: hidden; min-height: 100vh; }

        /* Animated background */
        body::before {
            content: '';
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background:
                radial-gradient(ellipse 80% 50% at 50% -5%, rgba(255,214,0,0.1) 0%, transparent 55%),
                radial-gradient(ellipse 40% 30% at 10% 80%, rgba(0,200,83,0.04) 0%, transparent 50%),
                radial-gradient(ellipse 40% 30% at 90% 20%, rgba(30,136,229,0.04) 0%, transparent 50%);
        }

        .container { position: relative; z-index: 1; max-width: 680px; padding: 36px 16px 60px; }

        /* ── Page Header ── */
        .page-header { text-align: center; margin-bottom: 44px; animation: fadeDown 0.7s ease both; }
        .trophy-main {
            font-size: 80px; display: block; margin-bottom: 10px;
            animation: trophyFloat 3s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(255,214,0,0.6));
        }
        @keyframes trophyFloat {
            0%, 100% { transform: translateY(0); filter: drop-shadow(0 0 20px rgba(255,214,0,0.5)); }
            50%       { transform: translateY(-8px); filter: drop-shadow(0 0 50px rgba(255,214,0,0.9)); }
        }
        @keyframes fadeDown { from { opacity:0; transform:translateY(-20px); } to { opacity:1; transform:translateY(0); } }
        @keyframes slideUp  { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }
        @keyframes confetti { 0%,100%{transform:rotate(-3deg) scale(1);} 50%{transform:rotate(3deg) scale(1.02);} }

        .page-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(2.4rem, 8vw, 4.5rem);
            letter-spacing: 0.1em; color: #fff; margin: 0; line-height: 1;
            text-shadow: 0 0 60px rgba(255,214,0,0.4);
        }
        .page-subtitle {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.78rem; letter-spacing: 0.28em; text-transform: uppercase;
            color: #2d4a65; margin-top: 8px;
        }

        /* ── Latest Winner — BIG CARD ── */
        .latest-winner {
            position: relative;
            background: linear-gradient(135deg, #1a1200 0%, #2a1e00 50%, #1a1200 100%);
            border: 2px solid rgba(255,214,0,0.5);
            border-radius: 20px;
            padding: 28px 24px;
            margin-bottom: 28px;
            text-align: center;
            overflow: hidden;
            animation: slideUp 0.5s ease 0.2s both;
            box-shadow: 0 0 60px rgba(255,214,0,0.12), inset 0 0 60px rgba(255,214,0,0.04);
        }
        .latest-winner::before {
            content: '';
            position: absolute; inset: 0;
            background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(255,214,0,0.08) 0%, transparent 60%);
            pointer-events: none;
        }
        .latest-label {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.72rem; letter-spacing: 0.25em; text-transform: uppercase;
            color: #ffd600; opacity: 0.7;
            background: rgba(255,214,0,0.08);
            border: 1px solid rgba(255,214,0,0.2);
            border-radius: 20px; padding: 4px 14px;
            display: inline-block; margin-bottom: 16px;
        }
        .latest-trophy { font-size: 52px; display: block; margin-bottom: 10px; animation: confetti 2s ease-in-out infinite; }
        .latest-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(2rem, 7vw, 3.5rem);
            letter-spacing: 0.08em; color: #ffd600; line-height: 1;
            text-shadow: 0 0 40px rgba(255,214,0,0.6);
        }
        .latest-date {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.85rem; letter-spacing: 0.15em; text-transform: uppercase;
            color: rgba(255,214,0,0.6); margin-top: 6px;
        }
        .latest-stars { font-size: 20px; margin-top: 12px; letter-spacing: 4px; opacity: 0.6; }

        /* Confetti particles */
        .particles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
        .particle {
            position: absolute; width: 6px; height: 6px; border-radius: 1px;
            opacity: 0; animation: fall linear infinite;
        }
        @keyframes fall {
            0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(300px) rotate(720deg); opacity: 0; }
        }

        /* ── History Section ── */
        .history-title {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.72rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
            color: #2d4a65; margin: 0 0 14px;
            display: flex; align-items: center; gap: 8px;
        }
        .history-title::after { content: ''; flex: 1; height: 1px; background: #1e3048; }

        .champions-list { display: flex; flex-direction: column; gap: 10px; }

        /* ── Champion Card (history) ── */
        .champ-card {
            background: linear-gradient(135deg, #0d1620 0%, #101e30 60%, #0d1620 100%);
            border: 1px solid rgba(255,214,0,0.15);
            border-radius: 14px; padding: 16px 18px;
            display: flex; align-items: center; gap: 16px;
            animation: slideUp 0.4s ease both;
            transition: all 0.2s;
            position: relative; overflow: hidden;
        }
        .champ-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,214,0,0.3), transparent);
        }
        .champ-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255,214,0,0.35);
            box-shadow: 0 6px 30px rgba(255,214,0,0.08);
        }
        .champ-rank {
            flex-shrink: 0; width: 40px; height: 40px; border-radius: 50%;
            background: rgba(255,214,0,0.06); border: 1.5px solid rgba(255,214,0,0.2);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; color: rgba(255,214,0,0.7);
        }
        .champ-rank.gold   { border-color:rgba(255,214,0,0.6); color:#ffd600; background:rgba(255,214,0,0.1); }
        .champ-rank.silver { border-color:rgba(192,192,192,0.4); color:#c0c0c0; background:rgba(192,192,192,0.06); }
        .champ-rank.bronze { border-color:rgba(205,127,50,0.4); color:#cd7f32; background:rgba(205,127,50,0.06); }
        .champ-icon { flex-shrink: 0; font-size: 26px; }
        .champ-info { flex: 1; min-width: 0; }
        .champ-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(1.2rem, 4vw, 1.6rem);
            letter-spacing: 0.06em; color: #fff; line-height: 1.1;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .champ-date {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase;
            color: rgba(255,214,0,0.55); margin-top: 2px;
        }
        .champ-edition {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase;
            padding: 2px 9px; border-radius: 10px;
            background: rgba(255,214,0,0.06); border: 1px solid rgba(255,214,0,0.15);
            color: rgba(255,214,0,0.5); white-space: nowrap; flex-shrink: 0;
        }

        /* Total badge */
        .total-badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(255,214,0,0.06); border: 1px solid rgba(255,214,0,0.15);
            border-radius: 20px; padding: 5px 16px;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase;
            color: rgba(255,214,0,0.6); margin-bottom: 28px;
        }

        /* Back button */
        .back-btn {
            background: transparent; color: #2d4a65;
            border: 1.5px solid #1e3048; border-radius: 10px;
            padding: 10px 22px; cursor: pointer; font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase;
            transition: all 0.2s; margin-top: 28px;
        }
        .back-btn:hover { border-color: rgba(255,214,0,0.4); color: rgba(255,214,0,0.7); }

        @media(max-width:480px) {
            .champ-card { padding:14px 14px; gap:12px; }
            .latest-winner { padding:22px 16px; }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- Header -->
    <div class="page-header">
        <span class="trophy-main">🏆</span>
        <h1 class="page-title">Hall of Champions</h1>
        <p class="page-subtitle">All Time League Winners</p>
    </div>

    <!-- Total Badge -->
    <div style="text-align:center;">
        <div class="total-badge">⭐ 3 Champions — All Time</div>
    </div>

    <!-- LATEST WINNER — BIG FEATURED CARD -->
    <div class="latest-winner">
        <div class="particles" id="particles"></div>
        <div class="latest-label">🥇 Latest Champion</div>
        <span class="latest-trophy">🏆</span>
        <div class="latest-name">ARIN MAHMOOD</div>
        <div class="latest-date">🗓 April 2025 — Season 3</div>
        <div class="latest-stars">★ ★ ★ ★ ★</div>
    </div>

    <!-- History -->
    <div class="history-title">Previous Champions</div>

    <div class="champions-list">

        <!-- Winner 2 -->
        <div class="champ-card" style="animation-delay:0.1s;">
            <div class="champ-rank silver">2</div>
            <div class="champ-icon">🥈</div>
            <div class="champ-info">
                <div class="champ-name">ARIN MAHMOOD</div>
                <div class="champ-date">🗓 3/2026</div>
            </div>
            <div class="champ-edition">Season 2</div>
        </div>

        <!-- Winner 1 -->
        <div class="champ-card" style="animation-delay:0.2s;">
            <div class="champ-rank bronze">1</div>
            <div class="champ-icon">🥉</div>
            <div class="champ-info">
                <div class="champ-name">ERON MAHMOOD</div>
                <div class="champ-date">🗓 12/2025</div>
            </div>
            <div class="champ-edition">Season 1</div>
        </div>

    </div>

    <div style="text-align:center;">
        <button class="back-btn" onclick="location.href='index.html'">⬅ Back</button>
    </div>

</div>

<script>
// Confetti particles
const colors = ['#ffd600','#fff176','#ffb300','#ffffff','#ffe57f'];
const p = document.getElementById('particles');
for (let i = 0; i < 18; i++) {
    const el = document.createElement('div');
    el.className = 'particle';
    el.style.cssText = `
        left:${Math.random()*100}%;
        top:${Math.random()*100}%;
        background:${colors[Math.floor(Math.random()*colors.length)]};
        animation-duration:${2.5+Math.random()*3}s;
        animation-delay:${Math.random()*3}s;
        width:${4+Math.random()*5}px;
        height:${4+Math.random()*5}px;
        border-radius:${Math.random()>0.5?'50%':'2px'};
    `;
    p.appendChild(el);
}
</script>
</body>
</html>
