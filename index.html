<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Football System</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600;700&family=Barlow:wght@300;400;500&display=swap"/>
<link rel="stylesheet" href="style.css"/>
<style>

/* ══════════════════════════════════════
   SPLASH SCREEN
══════════════════════════════════════ */
#splash {
  position: fixed; inset: 0; z-index: 9999;
  background: #020507;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  overflow: hidden;
}
#splash::before {
  content: '';
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(255,214,0,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,214,0,0.04) 1px, transparent 1px);
  background-size: 60px 60px;
  animation: gridMove 20s linear infinite;
}
@keyframes gridMove { to { background-position: 60px 60px; } }
#splash::after {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse 70% 70% at 50% 50%, transparent 30%, #020507 100%);
  pointer-events: none;
}
#pCanvas { position: absolute; inset: 0; z-index: 0; }

.sp-content {
  position: relative; z-index: 10;
  display: flex; flex-direction: column;
  align-items: center; text-align: center;
  padding: 20px;
  animation: spContentIn 1.2s cubic-bezier(.16,1,.3,1) .1s both;
}
@keyframes spContentIn {
  from { opacity: 0; transform: translateY(30px) scale(.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.sp-ball-wrap {
  position: relative;
  width: clamp(80px,18vw,110px);
  height: clamp(80px,18vw,110px);
  margin-bottom: 20px;
}
.sp-ball-ring {
  position: absolute; inset: -8px;
  border-radius: 50%;
  border: 1px solid rgba(255,214,0,0.3);
  animation: ringPulse 2s ease-in-out infinite;
}
.sp-ball-ring2 {
  position: absolute; inset: -18px;
  border-radius: 50%;
  border: 1px solid rgba(255,214,0,0.12);
  animation: ringPulse 2s ease-in-out .4s infinite;
}
@keyframes ringPulse {
  0%,100% { transform: scale(1); opacity: .6; }
  50% { transform: scale(1.06); opacity: 1; }
}
.sp-ball {
  width: 100%; height: 100%;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #3a2e00, #0d0a00);
  border: 1px solid rgba(255,214,0,0.4);
  display: flex; align-items: center; justify-content: center;
  font-size: clamp(36px,9vw,56px);
  animation: ballBreathe 3s ease-in-out infinite;
  box-shadow: 0 0 40px rgba(255,214,0,0.2), inset 0 0 30px rgba(0,0,0,0.5);
}
@keyframes ballBreathe {
  0%,100% { box-shadow: 0 0 30px rgba(255,214,0,0.15), inset 0 0 30px rgba(0,0,0,0.5); }
  50% { box-shadow: 0 0 60px rgba(255,214,0,0.4), inset 0 0 30px rgba(0,0,0,0.5); }
}

.sp-eyebrow {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: clamp(0.65rem, 2vw, 0.78rem);
  letter-spacing: 0.4em; text-transform: uppercase;
  color: rgba(255,214,0,0.6);
  margin-bottom: 6px;
  animation: fadeUp .6s ease .6s both;
}
.sp-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(3rem, 11vw, 6rem);
  letter-spacing: 0.04em; line-height: 0.9;
  color: #fff;
  animation: fadeUp .7s ease .7s both;
}
.sp-title .accent {
  color: transparent;
  -webkit-text-stroke: 1px rgba(255,214,0,0.8);
}
.sp-season {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: clamp(0.75rem, 2.5vw, 0.9rem);
  letter-spacing: 0.25em; text-transform: uppercase;
  color: rgba(255,255,255,0.25);
  margin-top: 6px; margin-bottom: 28px;
  animation: fadeUp .6s ease .8s both;
}
@keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }

.sp-line {
  width: clamp(40px, 10vw, 60px);
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,214,0,0.5), transparent);
  margin: 0 auto 24px;
  animation: lineExpand .8s ease .9s both;
}
@keyframes lineExpand { from { width:0; opacity:0; } to { opacity:1; } }

.sp-progress-wrap {
  width: clamp(220px,60vw,340px);
  animation: fadeUp .6s ease 1.1s both;
}
.sp-progress-row {
  display: flex; justify-content: space-between;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase;
  color: rgba(255,255,255,0.18);
  margin-bottom: 8px;
}
.sp-progress-track {
  height: 2px;
  background: rgba(255,255,255,0.06);
  border-radius: 1px; overflow: hidden;
}
.sp-progress-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, #ffd600, #fff176);
  border-radius: 1px;
  transition: width .05s linear;
  position: relative;
}
.sp-progress-fill::after {
  content: '';
  position: absolute; right: 0; top: -3px;
  width: 10px; height: 8px;
  background: radial-gradient(circle, rgba(255,214,0,0.8), transparent 70%);
  border-radius: 50%;
}
.sp-dots {
  display: flex; justify-content: center;
  gap: 5px; margin-top: 10px;
}
.sp-dot {
  width: 4px; height: 4px; border-radius: 50%;
  background: rgba(255,214,0,0.3);
  animation: dotPop 1.4s ease-in-out infinite;
}
.sp-dot:nth-child(2) { animation-delay: .2s; }
.sp-dot:nth-child(3) { animation-delay: .4s; }
@keyframes dotPop {
  0%,100% { background: rgba(255,214,0,0.25); transform: scale(1); }
  50% { background: rgba(255,214,0,0.9); transform: scale(1.6); }
}
#splash.exit {
  animation: splashExit .8s cubic-bezier(.4,0,1,1) forwards;
}
@keyframes splashExit {
  0%  { opacity: 1; transform: scale(1); }
  100%{ opacity: 0; transform: scale(1.03); }
}

/* ══════════════════════════════════════
   MAIN PAGE — SEASON ENDED
══════════════════════════════════════ */
body { background: #04080f; min-height: 100vh; overflow-x: hidden; }

body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 80% 50% at 50% -5%, rgba(255,214,0,0.12) 0%, transparent 55%),
    radial-gradient(ellipse 40% 30% at 10% 80%, rgba(0,200,83,0.03) 0%, transparent 50%);
}

.main-page {
  position: relative; z-index: 1;
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 40px 20px 60px;
  text-align: center;
}

/* ── Season Ended Banner ── */
.season-ended-banner {
  background: linear-gradient(135deg, #1a1200, #2a1e00, #1a1200);
  border: 2px solid rgba(255,214,0,0.5);
  border-radius: 20px;
  padding: 28px 32px;
  margin-bottom: 36px;
  position: relative; overflow: hidden;
  animation: bannerIn 0.8s cubic-bezier(.16,1,.3,1) 0.2s both;
  box-shadow: 0 0 80px rgba(255,214,0,0.1), inset 0 0 60px rgba(255,214,0,0.03);
  max-width: 420px; width: 100%;
}
.season-ended-banner::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(255,214,0,0.06) 0%, transparent 60%);
}
.season-ended-banner::after {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, rgba(255,214,0,0.8), transparent);
}
@keyframes bannerIn {
  from { opacity:0; transform:translateY(-20px) scale(0.97); }
  to   { opacity:1; transform:translateY(0) scale(1); }
}

.trophy-icon {
  font-size: 64px;
  display: block;
  margin-bottom: 12px;
  animation: trophyFloat 3s ease-in-out infinite;
  filter: drop-shadow(0 0 30px rgba(255,214,0,0.6));
}
@keyframes trophyFloat {
  0%,100% { transform:translateY(0); filter:drop-shadow(0 0 20px rgba(255,214,0,0.5)); }
  50%      { transform:translateY(-8px); filter:drop-shadow(0 0 50px rgba(255,214,0,0.9)); }
}

.ended-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 0.68rem; letter-spacing: 0.35em; text-transform: uppercase;
  color: rgba(255,214,0,0.6);
  background: rgba(255,214,0,0.08); border: 1px solid rgba(255,214,0,0.2);
  border-radius: 20px; padding: 4px 16px;
  display: inline-block; margin-bottom: 14px;
}
.ended-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(2.2rem, 8vw, 3.8rem);
  letter-spacing: 0.06em; color: #fff; line-height: 1;
  margin-bottom: 4px;
  text-shadow: 0 0 40px rgba(255,214,0,0.3);
}
.ended-season {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 0.9rem; letter-spacing: 0.2em; text-transform: uppercase;
  color: rgba(255,214,0,0.55);
  margin-bottom: 16px;
}
.ended-divider {
  width: 60px; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,214,0,0.4), transparent);
  margin: 14px auto 16px;
}

/* Winner line */
.winner-line {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  background: rgba(255,214,0,0.06); border: 1px solid rgba(255,214,0,0.2);
  border-radius: 12px; padding: 12px 20px; margin-bottom: 8px;
}
.winner-crown { font-size: 24px; }
.winner-text-wrap { text-align: left; }
.winner-micro {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 0.62rem; letter-spacing: 0.2em; text-transform: uppercase;
  color: rgba(255,214,0,0.45);
}
.winner-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(1.2rem, 4vw, 1.7rem);
  letter-spacing: 0.06em; color: #ffd600; line-height: 1.1;
  text-shadow: 0 0 20px rgba(255,214,0,0.5);
}

.confetti-particles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.cp {
  position: absolute; border-radius: 1px;
  opacity: 0; animation: cpFall linear infinite;
}
@keyframes cpFall {
  0%   { transform:translateY(-20px) rotate(0deg); opacity:1; }
  100% { transform:translateY(400px) rotate(720deg); opacity:0; }
}

/* ── Champions Button ── */
.champs-btn-wrap {
  animation: bannerIn 0.7s cubic-bezier(.16,1,.3,1) 0.5s both;
  max-width: 420px; width: 100%;
}
.champs-btn {
  width: 100%;
  padding: 18px 24px;
  background: linear-gradient(135deg, rgba(255,214,0,0.12), rgba(255,214,0,0.06));
  border: 2px solid rgba(255,214,0,0.5);
  border-radius: 16px;
  color: #ffd600;
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(1.3rem, 4vw, 1.7rem);
  letter-spacing: 0.1em;
  cursor: pointer;
  transition: all 0.25s;
  display: flex; align-items: center; justify-content: center; gap: 12px;
  text-shadow: 0 0 20px rgba(255,214,0,0.4);
  box-shadow: 0 4px 30px rgba(255,214,0,0.08);
}
.champs-btn:hover {
  background: linear-gradient(135deg, rgba(255,214,0,0.2), rgba(255,214,0,0.1));
  border-color: #ffd600;
  transform: translateY(-3px);
  box-shadow: 0 8px 40px rgba(255,214,0,0.2);
}
.champs-btn:active { transform: translateY(-1px); }

.champs-btn-sub {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase;
  color: rgba(255,214,0,0.4); margin-top: 10px; text-align: center;
}

/* ── Season stats strip ── */
.stats-strip {
  display: flex; gap: 12px; margin-top: 28px;
  flex-wrap: wrap; justify-content: center;
  max-width: 420px; width: 100%;
  animation: bannerIn 0.6s ease 0.7s both;
}
.stat-pill {
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07);
  border-radius: 10px; padding: 10px 16px; flex: 1; min-width: 80px;
}
.stat-pill-val {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.5rem; letter-spacing: 0.04em; color: #fff;
}
.stat-pill-lbl {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase;
  color: rgba(255,255,255,0.2); margin-top: 2px;
}
</style>
</head>
<body>

<!-- ══ SPLASH ══ -->
<div id="splash">
  <canvas id="pCanvas"></canvas>
  <div class="sp-content">
    <div class="sp-ball-wrap">
      <div class="sp-ball-ring2"></div>
      <div class="sp-ball-ring"></div>
      <div class="sp-ball">🏆</div>
    </div>
    <div class="sp-eyebrow">Season 4 — Concluded</div>
    <div class="sp-title">FOOTBALL<br/><span class="accent">SYSTEM</span></div>
    <div class="sp-season">Champion Has Been Crowned</div>
    <div class="sp-line"></div>
    <div class="sp-progress-wrap">
      <div class="sp-progress-row"><span>Loading Results</span><span id="spPct">0%</span></div>
      <div class="sp-progress-track"><div class="sp-progress-fill" id="spFill"></div></div>
      <div class="sp-dots"><div class="sp-dot"></div><div class="sp-dot"></div><div class="sp-dot"></div></div>
    </div>
  </div>
</div>

<!-- ══ MAIN PAGE ══ -->
<div class="main-page">

  <!-- Season Ended Banner -->
  <div class="season-ended-banner">
    <div class="confetti-particles" id="cpWrap"></div>

    <span class="trophy-icon">🏆</span>
    <div class="ended-label">Season Concluded</div>
    <div class="ended-title">Season 4</div>
    <div class="ended-season">2025 — 2026 &nbsp;·&nbsp; Final Standings</div>

    <div class="ended-divider"></div>

    <div class="winner-line">
      <div class="winner-crown">👑</div>
      <div class="winner-text-wrap">
        <div class="winner-micro">Season 4 Champion</div>
        <div class="winner-name">ERON MAHMOOD</div>
      </div>
    </div>

    <div style="font-family:'Barlow Condensed',sans-serif;font-size:0.65rem;letter-spacing:0.15em;text-transform:uppercase;color:rgba(255,214,0,0.28);margin-top:8px;position:relative;z-index:1;">
      PARISANT GERMAN — 78 pts · 38 Games
    </div>
  </div>

  <!-- Champions Button -->
  <div class="champs-btn-wrap">
    <button class="champs-btn" onclick="location.href='champions.html'">
      🏆 Hall of Champions
    </button>
    <div class="champs-btn-sub">View all season winners →</div>
  </div>

  <!-- Season 4 Stats Strip -->
  <div class="stats-strip">
    <div class="stat-pill">
      <div class="stat-pill-val">38</div>
      <div class="stat-pill-lbl">Games</div>
    </div>
    <div class="stat-pill">
      <div class="stat-pill-val">604</div>
      <div class="stat-pill-lbl">Total Goals</div>
    </div>
    <div class="stat-pill">
      <div class="stat-pill-val">3</div>
      <div class="stat-pill-lbl">Teams</div>
    </div>
    <div class="stat-pill">
      <div class="stat-pill-val">78</div>
      <div class="stat-pill-lbl">Winner Pts</div>
    </div>
  </div>

</div>

<script>
/* ── Confetti ── */
(function(){
  const wrap   = document.getElementById("cpWrap");
  const colors = ['#ffd600','#fff176','#ffb300','#ffffff','#ffe57f','#ff6f00'];
  for(let i=0;i<22;i++){
    const el = document.createElement('div');
    el.className = 'cp';
    el.style.cssText = `
      left:${Math.random()*100}%;
      top:${Math.random()*100}%;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      animation-duration:${2.5+Math.random()*3}s;
      animation-delay:${Math.random()*3}s;
      width:${4+Math.random()*5}px;
      height:${4+Math.random()*5}px;
      border-radius:${Math.random()>0.5?'50%':'2px'};
    `;
    wrap.appendChild(el);
  }
})();

/* ── Particle System (splash) ── */
(function(){
  const canvas = document.getElementById("pCanvas");
  const ctx    = canvas.getContext("2d");
  let W, H, particles = [];

  function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  resize(); window.addEventListener("resize", resize);

  function randomParticle(){
    return {
      x: Math.random() * W, y: H + Math.random() * 100,
      vx: (Math.random() - .5) * .5, vy: -(0.4 + Math.random() * 1.2),
      r: 1 + Math.random() * 2.5,
      alpha: .1 + Math.random() * .5,
      color: Math.random() > .5 ? "#ffd600" : Math.random() > .5 ? "#fff176" : "#ffffff"
    };
  }
  for(let i=0;i<55;i++){ const p=randomParticle(); p.y=Math.random()*H; particles.push(p); }

  function draw(){
    ctx.clearRect(0,0,W,H);
    particles.forEach(p=>{
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=p.color; ctx.globalAlpha=p.alpha; ctx.fill();
      p.x+=p.vx; p.y+=p.vy; p.alpha-=0.0005;
      if(p.y<-10||p.alpha<=0) Object.assign(p,randomParticle());
    });
    ctx.globalAlpha=1;
  }

  let animId;
  function loop(){ animId=requestAnimationFrame(loop); draw(); }
  loop();

  const splash = document.getElementById("splash");
  const fill   = document.getElementById("spFill");
  const pctEl  = document.getElementById("spPct");
  const DURATION = 2800;

  if(sessionStorage.getItem("splashDone")){
    splash.style.display="none"; cancelAnimationFrame(animId); return;
  }

  const t0 = performance.now();
  function tick(now){
    const p = Math.min((now-t0)/DURATION,1);
    const e = p<.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
    const v = Math.round(e*100);
    fill.style.width = v+"%"; pctEl.textContent = v+"%";
    if(p<1) requestAnimationFrame(tick); else exit();
  }
  requestAnimationFrame(tick);

  function exit(){
    sessionStorage.setItem("splashDone","1");
    splash.classList.add("exit");
    setTimeout(()=>{ splash.style.display="none"; cancelAnimationFrame(animId); }, 800);
  }
})();
</script>
</body>
</html>
