<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Season 5 Rules Vote</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600;700&family=Barlow:wght@300;400;500&display=swap"/>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#03060a;--bg2:#080e16;--bg3:#0d1520;--bg4:#121d2a;
  --border:#192533;--border2:#1f3040;
  --blue:#448aff;--bluedim:rgba(68,138,255,0.08);
  --green:#00e676;--gold:#ffd600;--red:#ff5252;
  --text:#eef2f8;--text2:#7a8fa8;--text3:#3a5068;
}
html{scroll-behavior:smooth;}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 50% at 50% 0%,rgba(68,138,255,0.06) 0%,transparent 55%),
             radial-gradient(ellipse 40% 30% at 80% 80%,rgba(0,230,118,0.03) 0%,transparent 50%);}

.wrap{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:24px 14px 70px;}

/* ── ANIMATIONS ── */
@keyframes fadeDown{from{opacity:0;transform:translateY(-16px);}to{opacity:1;transform:translateY(0);}}
@keyframes slideUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
@keyframes pulse{0%,100%{opacity:.6;}50%{opacity:1;}}

/* ── HEADER ── */
.hero{text-align:center;margin-bottom:28px;animation:fadeDown .6s ease both;}
.hero-badge{display:inline-flex;align-items:center;gap:6px;
  background:var(--bluedim);border:1px solid rgba(68,138,255,0.25);
  border-radius:20px;padding:4px 14px;margin-bottom:14px;
  font-family:'Barlow Condensed',sans-serif;font-size:0.68rem;
  letter-spacing:0.2em;text-transform:uppercase;color:rgba(68,138,255,0.8);}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--blue);animation:pulse 1.2s infinite;}
.hero-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(2rem,7vw,3.2rem);
  letter-spacing:0.08em;color:#fff;line-height:1;margin-bottom:4px;
  text-shadow:0 0 40px rgba(68,138,255,0.3);}
.hero-sub{font-family:'Barlow Condensed',sans-serif;font-size:0.75rem;
  letter-spacing:0.18em;text-transform:uppercase;color:var(--text3);}

/* ── LOGIN GATE ── */
#loginGate{animation:slideUp .5s ease .1s both;}
.gate-card{background:var(--bg3);border:1px solid var(--border2);border-radius:18px;
  padding:28px 22px;max-width:360px;margin:0 auto;text-align:center;}
.gate-icon{font-size:40px;margin-bottom:12px;display:block;}
.gate-title{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:0.08em;
  color:#fff;margin-bottom:4px;}
.gate-sub{font-family:'Barlow Condensed',sans-serif;font-size:0.78rem;letter-spacing:0.1em;
  text-transform:uppercase;color:var(--text3);margin-bottom:20px;}
.player-btns{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
.player-btn{padding:13px;border-radius:12px;border:1.5px solid var(--border2);
  background:var(--bg2);color:var(--text);font-family:'Barlow Condensed',sans-serif;
  font-size:0.95rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;
  cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:10px;}
.player-btn:hover{border-color:var(--blue);color:var(--blue);background:var(--bluedim);}
.player-btn .pb-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:0.8rem;font-weight:700;flex-shrink:0;}
.pb-eron  .pb-avatar{background:rgba(255,214,0,0.15);color:var(--gold);}
.pb-lawin .pb-avatar{background:rgba(0,230,118,0.12);color:var(--green);}
.pb-arin  .pb-avatar{background:rgba(68,138,255,0.12);color:var(--blue);}
.pin-wrap{display:none;margin-top:6px;}
.pin-input{width:100%;padding:12px;background:var(--bg);border:1.5px solid var(--border2);
  border-radius:10px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:1.2rem;
  letter-spacing:0.3em;text-align:center;outline:none;transition:border-color .2s;}
.pin-input:focus{border-color:var(--blue);}
.pin-submit{margin-top:8px;width:100%;padding:11px;background:var(--blue);color:#fff;
  border:none;border-radius:10px;font-family:'Barlow Condensed',sans-serif;font-size:0.9rem;
  font-weight:700;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;transition:all .2s;}
.pin-submit:hover{background:#1e5fd4;}
.gate-err{color:var(--red);font-family:'Barlow Condensed',sans-serif;font-size:0.8rem;
  letter-spacing:0.06em;margin-top:8px;display:none;}

/* ── VOTING PANEL ── */
#votePanel{display:none;animation:slideUp .4s ease both;}
.voter-banner{display:flex;align-items:center;gap:12px;
  background:var(--bg3);border:1px solid var(--border2);border-radius:14px;
  padding:14px 18px;margin-bottom:20px;}
.vb-avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:1rem;flex-shrink:0;}
.vb-name{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:0.06em;color:#fff;}
.vb-sub{font-family:'Barlow Condensed',sans-serif;font-size:0.72rem;letter-spacing:0.08em;
  text-transform:uppercase;color:var(--text3);}
.vb-status{margin-left:auto;font-family:'Barlow Condensed',sans-serif;font-size:0.7rem;
  letter-spacing:0.1em;text-transform:uppercase;padding:3px 10px;border-radius:20px;}
.already-voted{background:rgba(255,82,82,0.1);border:1px solid rgba(255,82,82,0.25);color:var(--red);}
.can-vote{background:rgba(0,230,118,0.1);border:1px solid rgba(0,230,118,0.25);color:var(--green);}

.rules-title{font-family:'Barlow Condensed',sans-serif;font-size:0.72rem;font-weight:700;
  letter-spacing:0.16em;text-transform:uppercase;color:var(--text3);
  margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:6px;}

/* ── RULE CARD ── */
.rule-card{background:var(--bg3);border:1.5px solid var(--border);border-radius:14px;
  padding:16px 18px;margin-bottom:12px;transition:border-color .2s;position:relative;overflow:hidden;}
.rule-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--blue),transparent);opacity:0.3;}
.rule-card.voted-yes{border-color:rgba(0,230,118,0.4);background:rgba(0,230,118,0.04);}
.rule-card.voted-yes::before{background:linear-gradient(90deg,transparent,var(--green),transparent);opacity:0.5;}
.rule-card.voted-no{border-color:rgba(255,82,82,0.3);background:rgba(255,82,82,0.03);}
.rule-card.voted-no::before{background:linear-gradient(90deg,transparent,var(--red),transparent);opacity:0.4;}
.rule-card.disabled{opacity:.5;pointer-events:none;}

.rule-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px;}
.rule-num{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;letter-spacing:0.04em;
  color:rgba(68,138,255,0.3);line-height:1;flex-shrink:0;width:32px;}
.rule-text{font-family:'Barlow Condensed',sans-serif;font-size:1rem;font-weight:700;
  letter-spacing:0.04em;color:var(--text);line-height:1.4;flex:1;}

.vote-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.vote-btn{padding:11px;border-radius:10px;font-family:'Barlow Condensed',sans-serif;
  font-size:0.9rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;
  cursor:pointer;transition:all .18s;border:1.5px solid;display:flex;
  align-items:center;justify-content:center;gap:6px;}
.vote-yes{background:rgba(0,230,118,0.08);border-color:rgba(0,230,118,0.3);color:var(--green);}
.vote-yes:hover,.vote-yes.active{background:rgba(0,230,118,0.18);border-color:var(--green);
  box-shadow:0 0 16px rgba(0,230,118,0.15);}
.vote-no{background:rgba(255,82,82,0.06);border-color:rgba(255,82,82,0.25);color:var(--red);}
.vote-no:hover,.vote-no.active{background:rgba(255,82,82,0.14);border-color:var(--red);
  box-shadow:0 0 14px rgba(255,82,82,0.12);}
.vote-btn.active{transform:scale(1.02);}

.voted-badge{display:none;text-align:center;font-family:'Barlow Condensed',sans-serif;
  font-size:0.8rem;letter-spacing:0.1em;text-transform:uppercase;padding:8px;
  border-radius:8px;}
.voted-badge.yes{background:rgba(0,230,118,0.1);color:var(--green);}
.voted-badge.no{background:rgba(255,82,82,0.08);color:var(--red);}

/* Submit button */
.submit-wrap{margin-top:20px;}
.submit-btn{width:100%;padding:15px;background:var(--blue);color:#fff;border:none;
  border-radius:14px;font-family:'Bebas Neue',sans-serif;font-size:1.2rem;
  letter-spacing:0.1em;cursor:pointer;transition:all .2s;
  box-shadow:0 0 24px rgba(68,138,255,0.2);}
.submit-btn:hover{background:#2979ff;transform:translateY(-1px);box-shadow:0 6px 28px rgba(68,138,255,0.35);}
.submit-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}

/* ── REVIEW PANEL ── */
#reviewPanel{display:none;animation:slideUp .5s ease both;}
.review-header{text-align:center;margin-bottom:24px;}
.review-header h2{font-family:'Bebas Neue',sans-serif;font-size:clamp(1.8rem,6vw,2.8rem);
  letter-spacing:0.08em;color:#fff;margin-bottom:4px;}
.review-header p{font-family:'Barlow Condensed',sans-serif;font-size:0.75rem;
  letter-spacing:0.14em;text-transform:uppercase;color:var(--text3);}

.review-card{border-radius:14px;padding:16px 18px;margin-bottom:12px;
  border:1.5px solid;position:relative;overflow:hidden;}
.review-card.approved{background:rgba(0,230,118,0.05);border-color:rgba(0,230,118,0.3);}
.review-card.approved::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,var(--green),transparent);}
.review-card.rejected{background:rgba(255,82,82,0.04);border-color:rgba(255,82,82,0.25);}
.review-card.rejected::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,var(--red),transparent);}

.rv-top{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.rv-num{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:0.04em;
  color:var(--text3);width:26px;flex-shrink:0;}
.rv-text{font-family:'Barlow Condensed',sans-serif;font-size:0.95rem;font-weight:700;
  letter-spacing:0.04em;color:var(--text);flex:1;}
.rv-result{font-family:'Bebas Neue',sans-serif;font-size:0.8rem;letter-spacing:0.1em;
  padding:3px 12px;border-radius:20px;flex-shrink:0;}
.approved .rv-result{background:rgba(0,230,118,0.15);border:1px solid rgba(0,230,118,0.3);color:var(--green);}
.rejected .rv-result{background:rgba(255,82,82,0.1);border:1px solid rgba(255,82,82,0.25);color:var(--red);}

.rv-votes{display:flex;gap:8px;flex-wrap:wrap;}
.rv-vote-pill{font-family:'Barlow Condensed',sans-serif;font-size:0.72rem;
  letter-spacing:0.06em;text-transform:uppercase;padding:3px 10px;border-radius:20px;}
.rv-vote-pill.yes{background:rgba(0,230,118,0.1);border:1px solid rgba(0,230,118,0.2);color:var(--green);}
.rv-vote-pill.no{background:rgba(255,82,82,0.08);border:1px solid rgba(255,82,82,0.2);color:var(--red);}

/* Progress tracker */
.vote-tracker{background:var(--bg3);border:1px solid var(--border);border-radius:14px;
  padding:16px 18px;margin-bottom:20px;}
.vt-title{font-family:'Barlow Condensed',sans-serif;font-size:0.7rem;font-weight:700;
  letter-spacing:0.14em;text-transform:uppercase;color:var(--text3);margin-bottom:12px;}
.vt-players{display:flex;gap:10px;flex-wrap:wrap;}
.vt-player{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:10px;
  border:1px solid var(--border2);background:var(--bg2);}
.vt-player.done{border-color:rgba(0,230,118,0.3);background:rgba(0,230,118,0.05);}
.vt-player.done .vt-dot{background:var(--green);}
.vt-dot{width:8px;height:8px;border-radius:50%;background:var(--text3);}
.vt-pname{font-family:'Barlow Condensed',sans-serif;font-size:0.8rem;letter-spacing:0.06em;
  text-transform:uppercase;color:var(--text2);}
.vt-player.done .vt-pname{color:var(--green);}

/* Review btn */
.review-btn{width:100%;padding:15px;background:linear-gradient(135deg,#1a1200,#2a1e00);
  border:2px solid rgba(255,214,0,0.4);border-radius:14px;
  font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:0.1em;
  color:var(--gold);cursor:pointer;transition:all .2s;margin-top:16px;
  text-shadow:0 0 16px rgba(255,214,0,0.3);box-shadow:0 0 24px rgba(255,214,0,0.08);}
.review-btn:hover{border-color:rgba(255,214,0,0.7);box-shadow:0 6px 28px rgba(255,214,0,0.15);}

/* Toast */
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-80px);
  z-index:999;padding:10px 24px;border-radius:30px;font-family:'Barlow Condensed',sans-serif;
  font-weight:700;font-size:0.88rem;letter-spacing:0.06em;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.ok{background:var(--green);color:#000;}
.toast.err{background:var(--red);color:#fff;}
.toast.info{background:var(--blue);color:#fff;}

/* Back */
.back-btn{background:transparent!important;border:1.5px solid var(--border2)!important;
  color:var(--text3)!important;font-family:'Barlow Condensed',sans-serif;font-size:0.85rem;
  letter-spacing:0.08em;text-transform:uppercase;padding:10px 22px;border-radius:10px;
  cursor:pointer;transition:all .2s;margin-top:20px;}
.back-btn:hover{border-color:var(--blue)!important;color:var(--blue)!important;}

.section-sep{height:1px;background:var(--border);margin:24px 0;}

@media(max-width:480px){
  .vote-btns{grid-template-columns:1fr 1fr;}
  .rule-text{font-size:0.92rem;}
}
</style>
</head>
<body>
<div class="wrap">

  <!-- HEADER -->
  <div class="hero">
    <div class="hero-badge"><span class="live-dot"></span> Season 5 — Rule Voting</div>
    <h1 class="hero-title">📋 Add Rules</h1>
    <p class="hero-sub">Vote for Season 5 Rules — 2 of 3 required to approve</p>
  </div>

  <!-- VOTE PROGRESS TRACKER (always visible) -->
  <div class="vote-tracker" id="voteTracker">
    <div class="vt-title">📊 Voting Progress</div>
    <div class="vt-players">
      <div class="vt-player" id="tracker-eron">
        <div class="vt-dot"></div>
        <div class="vt-pname">ERON</div>
      </div>
      <div class="vt-player" id="tracker-lawin">
        <div class="vt-dot"></div>
        <div class="vt-pname">LAWIN</div>
      </div>
      <div class="vt-player" id="tracker-arin">
        <div class="vt-dot"></div>
        <div class="vt-pname">ARIN</div>
      </div>
    </div>
    <div id="reviewBtnWrap" style="display:none;">
      <div class="section-sep" style="margin:14px 0;"></div>
      <button class="review-btn" onclick="showReview()">🏆 Review Votes — See Results</button>
    </div>
  </div>

  <!-- LOGIN GATE -->
  <div id="loginGate">
    <div class="gate-card">
      <span class="gate-icon">🔐</span>
      <div class="gate-title">Login to Vote</div>
      <div class="gate-sub">Select your name and enter your PIN</div>
      <div class="player-btns">
        <button class="player-btn pb-eron"  onclick="selectPlayer('eron')">
          <div class="pb-avatar">ER</div>ERON MAHMOOD
        </button>
        <button class="player-btn pb-lawin" onclick="selectPlayer('lawin')">
          <div class="pb-avatar">LW</div>LAWIN
        </button>
        <button class="player-btn pb-arin"  onclick="selectPlayer('arin')">
          <div class="pb-avatar">AR</div>ARIN MAHMOOD
        </button>
      </div>
      <div class="pin-wrap" id="pinWrap">
        <input class="pin-input" id="pinInput" type="password"
          placeholder="Enter PIN" maxlength="6" autocomplete="off"/>
        <button class="pin-submit" onclick="submitPin()">Enter →</button>
        <div class="gate-err" id="pinErr">❌ Wrong PIN</div>
      </div>
    </div>
  </div>

  <!-- VOTE PANEL -->
  <div id="votePanel">
    <div class="voter-banner" id="voterBanner">
      <div class="vb-avatar" id="vbAvatar"></div>
      <div>
        <div class="vb-name" id="vbName"></div>
        <div class="vb-sub">Season 5 Rule Voting</div>
      </div>
      <div class="vb-status" id="vbStatus"></div>
    </div>

    <div class="rules-title">📋 Vote on Each Rule</div>
    <div id="rulesList"></div>

    <div class="submit-wrap" id="submitWrap">
      <button class="submit-btn" id="submitBtn" onclick="submitVotes()">
        ✅ Submit My Votes
      </button>
    </div>
  </div>

  <!-- REVIEW PANEL -->
  <div id="reviewPanel">
    <div class="review-header">
      <h2>🏆 Voting Results</h2>
      <p>Final decision on Season 5 Rules</p>
    </div>
    <div id="reviewList"></div>
  </div>

  <div style="text-align:center;">
    <button class="back-btn" onclick="location.href='index.html'">⬅ Back to Home</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="firebase.js"></script>
<script>
// ═══════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════
const PLAYERS = {
  eron:  { pin:"0021", name:"ERON MAHMOOD",  initials:"ER", colorClass:"gold",  avatarBg:"rgba(255,214,0,0.15)",  avatarColor:"#ffd600" },
  lawin: { pin:"002",  name:"LAWIN",         initials:"LW", colorClass:"green", avatarBg:"rgba(0,230,118,0.12)", avatarColor:"#00e676" },
  arin:  { pin:"0023", name:"ARIN MAHMOOD",  initials:"AR", colorClass:"blue",  avatarBg:"rgba(68,138,255,0.12)",avatarColor:"#448aff" }
};

const RULES = [
  { id:"r1", text:"پێکانی ئاسای بێت بە 5 یاری" },
  { id:"r2", text:"Home Away" },
  { id:"r3", text:"تیپی دووبارە" },
  { id:"r4", text:"Handball" },
  { id:"r5", text:"نیوای خوڵ یاریزان بێت" },
  { id:"r6", text:"برادەر یاری ناکات" },
  { id:"r7", text:"Conference جنێو بای سەر ئاکرەی" },
  { id:"r8", text:"هەموو گارەک Conference بکرێت" }
];

// ═══════════════════════════════════════
//  STATE
// ═══════════════════════════════════════
let currentPlayer = null;
let selectedPlayer = null;
let myVotes = {};     // ruleId -> "yes"|"no"
let allVotes = {};    // { playerId: { ruleId: "yes"|"no" } }
let db;

// ═══════════════════════════════════════
//  FIREBASE INIT
// ═══════════════════════════════════════
function waitDB(cb) {
  let t = 0;
  const iv = setInterval(() => {
    if (window.db) { clearInterval(iv); db = window.db; cb(); }
    else if (++t > 50) { clearInterval(iv); console.warn("DB not ready"); cb(); }
  }, 100);
}

waitDB(() => {
  loadVotes();
  // Live listener
  if (db) {
    db.collection("season5Votes").onSnapshot(() => loadVotes());
  }
});

// ═══════════════════════════════════════
//  LOAD VOTES
// ═══════════════════════════════════════
function loadVotes() {
  if (!db) return;
  db.collection("season5Votes").get().then(snap => {
    allVotes = {};
    snap.forEach(doc => {
      allVotes[doc.id] = doc.data();
    });
    updateTracker();
    // If panel open, refresh
    if (currentPlayer && document.getElementById("votePanel").style.display !== "none") {
      openVotePanel(currentPlayer);
    }
  }).catch(err => console.error(err));
}

// ═══════════════════════════════════════
//  TRACKER
// ═══════════════════════════════════════
function updateTracker() {
  const all3Done = Object.keys(PLAYERS).every(p => !!allVotes[p]);
  Object.keys(PLAYERS).forEach(pid => {
    const el = document.getElementById("tracker-" + pid);
    if (el) {
      if (allVotes[pid]) el.classList.add("done");
      else el.classList.remove("done");
    }
  });
  const reviewWrap = document.getElementById("reviewBtnWrap");
  if (reviewWrap) reviewWrap.style.display = all3Done ? "block" : "none";
}

// ═══════════════════════════════════════
//  LOGIN
// ═══════════════════════════════════════
function selectPlayer(pid) {
  selectedPlayer = pid;
  const pw = document.getElementById("pinWrap");
  pw.style.display = "block";
  document.getElementById("pinInput").value = "";
  document.getElementById("pinErr").style.display = "none";
  document.getElementById("pinInput").focus();
  // Highlight selected
  document.querySelectorAll(".player-btn").forEach(b => b.style.opacity = "0.5");
  document.querySelectorAll(".player-btn")[["eron","lawin","arin"].indexOf(pid)].style.opacity = "1";
}

document.addEventListener("keydown", e => {
  if (e.key === "Enter" && document.getElementById("pinInput").style.display !== "none") {
    submitPin();
  }
});

function submitPin() {
  const pin = document.getElementById("pinInput").value;
  const p   = PLAYERS[selectedPlayer];
  if (!p) return;
  if (pin === p.pin) {
    currentPlayer = selectedPlayer;
    document.getElementById("loginGate").style.display = "none";
    openVotePanel(currentPlayer);
  } else {
    document.getElementById("pinErr").style.display = "block";
    document.getElementById("pinInput").value = "";
  }
}

// ═══════════════════════════════════════
//  VOTE PANEL
// ═══════════════════════════════════════
function openVotePanel(pid) {
  const p = PLAYERS[pid];
  const panel = document.getElementById("votePanel");
  panel.style.display = "block";

  // Banner
  const av = document.getElementById("vbAvatar");
  av.textContent = p.initials;
  av.style.background = p.avatarBg;
  av.style.color = p.avatarColor;
  document.getElementById("vbName").textContent = p.name;

  const alreadyVoted = !!allVotes[pid];
  const statusEl = document.getElementById("vbStatus");
  statusEl.textContent = alreadyVoted ? "Already Voted" : "Ready to Vote";
  statusEl.className = "vb-status " + (alreadyVoted ? "already-voted" : "can-vote");

  // Existing votes for this player
  const existingVotes = allVotes[pid] || {};
  myVotes = { ...existingVotes };

  renderRules(alreadyVoted);

  // Show/hide submit
  document.getElementById("submitWrap").style.display = alreadyVoted ? "none" : "block";
}

function renderRules(readOnly) {
  const container = document.getElementById("rulesList");
  container.innerHTML = "";

  RULES.forEach(rule => {
    const myV = myVotes[rule.id]; // "yes"|"no"|undefined
    let cardClass = "rule-card";
    if (myV === "yes") cardClass += " voted-yes";
    if (myV === "no")  cardClass += " voted-no";
    if (readOnly)      cardClass += " disabled";

    const card = document.createElement("div");
    card.className = cardClass;
    card.id = "card-" + rule.id;

    card.innerHTML = `
      <div class="rule-top">
        <div class="rule-num">${rule.id.replace("r","")}</div>
        <div class="rule-text">${rule.text}</div>
      </div>
      ${readOnly ? `
        <div class="voted-badge ${myV}" style="display:block;">
          ${myV === "yes" ? "✅ You Voted YES" : "❌ You Voted NO"}
        </div>
      ` : `
        <div class="vote-btns">
          <button class="vote-btn vote-yes ${myV==='yes'?'active':''}"
            onclick="castVote('${rule.id}','yes')">
            ✅ YES
          </button>
          <button class="vote-btn vote-no ${myV==='no'?'active':''}"
            onclick="castVote('${rule.id}','no')">
            ❌ NO
          </button>
        </div>
      `}
    `;
    container.appendChild(card);
  });
}

function castVote(ruleId, choice) {
  myVotes[ruleId] = choice;

  // Update card style
  const card = document.getElementById("card-" + ruleId);
  card.className = "rule-card " + (choice === "yes" ? "voted-yes" : "voted-no");

  // Update buttons
  const btns = card.querySelectorAll(".vote-btn");
  btns.forEach(b => b.classList.remove("active"));
  const activeBtn = card.querySelector(".vote-" + choice);
  if (activeBtn) activeBtn.classList.add("active");

  // Check if all rules voted
  const allVoted = RULES.every(r => myVotes[r.id]);
  const submitBtn = document.getElementById("submitBtn");
  if (submitBtn) {
    submitBtn.style.opacity = allVoted ? "1" : "0.5";
    submitBtn.textContent = allVoted
      ? "✅ Submit My Votes (" + RULES.length + "/" + RULES.length + ")"
      : "✅ Submit Votes (" + Object.keys(myVotes).length + "/" + RULES.length + " voted)";
  }
}

function submitVotes() {
  const allVoted = RULES.every(r => myVotes[r.id]);
  if (!allVoted) {
    showToast("❌ Please vote on ALL " + RULES.length + " rules first", "err");
    return;
  }
  if (!db) { showToast("❌ Firebase not ready", "err"); return; }
  if (allVotes[currentPlayer]) {
    showToast("❌ You already submitted your votes", "err");
    return;
  }

  const payload = { ...myVotes, submittedAt: new Date().toISOString(), player: currentPlayer };
  const btn = document.getElementById("submitBtn");
  btn.disabled = true; btn.textContent = "⏳ Submitting...";

  db.collection("season5Votes").doc(currentPlayer).set(payload)
    .then(() => {
      showToast("✅ Votes submitted! Thank you " + PLAYERS[currentPlayer].name, "ok");
      // Update banner
      const statusEl = document.getElementById("vbStatus");
      statusEl.textContent = "Vote Submitted ✓";
      statusEl.className = "vb-status can-vote";
      document.getElementById("submitWrap").style.display = "none";
      renderRules(true);
      loadVotes();
    })
    .catch(err => {
      showToast("❌ Error: " + err.message, "err");
      btn.disabled = false;
      btn.textContent = "✅ Submit My Votes";
    });
}

// ═══════════════════════════════════════
//  REVIEW
// ═══════════════════════════════════════
function showReview() {
  document.getElementById("loginGate").style.display  = "none";
  document.getElementById("votePanel").style.display  = "none";
  document.getElementById("reviewPanel").style.display = "block";
  renderReview();
}

function renderReview() {
  const container = document.getElementById("reviewList");
  container.innerHTML = "";

  let approvedCount = 0, rejectedCount = 0;

  RULES.forEach(rule => {
    let yesVoters = [], noVoters = [];
    Object.keys(PLAYERS).forEach(pid => {
      if (allVotes[pid] && allVotes[pid][rule.id]) {
        if (allVotes[pid][rule.id] === "yes") yesVoters.push(PLAYERS[pid].name);
        else noVoters.push(PLAYERS[pid].name);
      }
    });

    const approved = yesVoters.length >= 2;
    if (approved) approvedCount++; else rejectedCount++;

    const card = document.createElement("div");
    card.className = "review-card " + (approved ? "approved" : "rejected");

    const yesPills = yesVoters.map(n =>
      `<span class="rv-vote-pill yes">✅ ${n}</span>`).join("");
    const noPills  = noVoters.map(n =>
      `<span class="rv-vote-pill no">❌ ${n}</span>`).join("");

    card.innerHTML = `
      <div class="rv-top">
        <div class="rv-num">${rule.id.replace("r","")}</div>
        <div class="rv-text">${rule.text}</div>
        <div class="rv-result">${approved ? "✅ APPROVED" : "❌ REJECTED"}</div>
      </div>
      <div class="rv-votes">
        ${yesPills}${noPills}
        ${(yesVoters.length + noVoters.length) === 0 ? '<span style="color:var(--text3);font-size:0.75rem;font-family:\'Barlow Condensed\',sans-serif;letter-spacing:0.06em;">No votes yet</span>' : ""}
      </div>
    `;
    container.appendChild(card);
  });

  // Summary
  const summary = document.createElement("div");
  summary.style.cssText = "background:var(--bg3);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-top:8px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap;";
  summary.innerHTML = `
    <div style="text-align:center;">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--green);">${approvedCount}</div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:0.65rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);">Approved</div>
    </div>
    <div style="width:1px;background:var(--border);"></div>
    <div style="text-align:center;">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--red);">${rejectedCount}</div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:0.65rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);">Rejected</div>
    </div>
    <div style="width:1px;background:var(--border);"></div>
    <div style="text-align:center;">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--blue);">3</div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:0.65rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);">Voters</div>
    </div>
  `;
  container.appendChild(summary);
}

// ═══════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════
function showToast(msg, type) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "toast show " + (type||"info");
  setTimeout(() => t.className = "toast " + (type||"info"), 3000);
}
</script>
