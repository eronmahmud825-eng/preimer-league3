<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Football System — Season 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600;700&family=Barlow:wght@300;400;500&display=swap"/>
<link rel="stylesheet" href="style.css"/>
<style>

/* ══ SPLASH ══ */
#splash{
  position:fixed;inset:0;z-index:9999;
  background:#020507;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  overflow:hidden;
}
#splash::before{
  content:'';position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(0,200,83,0.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,200,83,0.04) 1px,transparent 1px);
  background-size:60px 60px;
  animation:gridMove 20s linear infinite;
}
@keyframes gridMove{to{background-position:60px 60px;}}
#splash::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 70% 70% at 50% 50%,transparent 30%,#020507 100%);
  pointer-events:none;
}
#pCanvas{position:absolute;inset:0;z-index:0;}

.sp-content{
  position:relative;z-index:10;
  display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:20px;
  animation:spIn 1.2s cubic-bezier(.16,1,.3,1) .1s both;
}
@keyframes spIn{from{opacity:0;transform:translateY(30px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}

.sp-ball-wrap{position:relative;width:clamp(80px,18vw,110px);height:clamp(80px,18vw,110px);margin-bottom:20px;}
.sp-ring{position:absolute;inset:-8px;border-radius:50%;border:1px solid rgba(0,200,83,0.2);animation:rp 2s ease-in-out infinite;}
.sp-ring2{position:absolute;inset:-18px;border-radius:50%;border:1px solid rgba(0,200,83,0.08);animation:rp 2s ease-in-out .4s infinite;}
@keyframes rp{0%,100%{transform:scale(1);opacity:.6;}50%{transform:scale(1.06);opacity:1;}}
.sp-ball{
  width:100%;height:100%;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#1a3a28,#030d07);
  border:1px solid rgba(0,200,83,0.3);
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(36px,9vw,56px);
  animation:bb 3s ease-in-out infinite;
  box-shadow:0 0 40px rgba(0,200,83,0.15),inset 0 0 30px rgba(0,0,0,0.5);
}
@keyframes bb{0%,100%{box-shadow:0 0 30px rgba(0,200,83,0.12),inset 0 0 30px rgba(0,0,0,0.5);}50%{box-shadow:0 0 60px rgba(0,200,83,0.28),inset 0 0 30px rgba(0,0,0,0.5);}}

.sp-eyebrow{font-family:'Barlow Condensed',sans-serif;font-size:clamp(0.65rem,2vw,0.78rem);letter-spacing:0.4em;text-transform:uppercase;color:rgba(0,200,83,0.55);margin-bottom:6px;animation:fu .6s ease .6s both;}
.sp-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(3rem,11vw,6rem);letter-spacing:0.04em;line-height:0.9;color:#fff;animation:fu .7s ease .7s both;}
.sp-title .acc{color:transparent;-webkit-text-stroke:1px rgba(0,200,83,0.7);}
.sp-season{font-family:'Barlow Condensed',sans-serif;font-size:clamp(0.75rem,2.5vw,0.9rem);letter-spacing:0.25em;text-transform:uppercase;color:rgba(255,255,255,0.2);margin-top:6px;margin-bottom:28px;animation:fu .6s ease .8s both;}
@keyframes fu{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.sp-line{width:clamp(40px,10vw,60px);height:1px;background:linear-gradient(90deg,transparent,rgba(0,200,83,0.4),transparent);margin:0 auto 24px;animation:le .8s ease .9s both;}
@keyframes le{from{width:0;opacity:0;}to{opacity:1;}}

.sp-prog-wrap{width:clamp(220px,60vw,340px);animation:fu .6s ease 1.1s both;}
.sp-prog-row{display:flex;justify-content:space-between;font-family:'Barlow Condensed',sans-serif;font-size:0.62rem;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.18);margin-bottom:8px;}
.sp-prog-track{height:2px;background:rgba(255,255,255,0.06);border-radius:1px;overflow:hidden;}
.sp-prog-fill{height:100%;width:0%;background:linear-gradient(90deg,#00c853,#69f0ae);border-radius:1px;transition:width .05s linear;}
.sp-dots{display:flex;justify-content:center;gap:5px;margin-top:10px;}
.sp-dot{width:4px;height:4px;border-radius:50%;background:rgba(0,200,83,0.3);animation:dp 1.4s ease-in-out infinite;}
.sp-dot:nth-child(2){animation-delay:.2s;}.sp-dot:nth-child(3){animation-delay:.4s;}
@keyframes dp{0%,100%{background:rgba(0,200,83,0.25);transform:scale(1);}50%{background:rgba(0,200,83,0.9);transform:scale(1.6);}}
#splash.exit{animation:sExit .8s cubic-bezier(.4,0,1,1) forwards;}
@keyframes sExit{0%{opacity:1;transform:scale(1);}100%{opacity:0;transform:scale(1.03);}}

/* ══ CLUB TEAMS ══ */
.nations-strip{
  max-width:700px;margin:0 auto 20px;padding:0 16px;
}
.nations-label{
  font-family:'Barlow Condensed',sans-serif;
  font-size:0.68rem;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;
  color:#2d4a65;margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
}
.nations-label::after{content:'';flex:1;height:1px;background:#1e3048;}
.nations-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.nation-card{
  background:linear-gradient(135deg,#0a1620,#0d1e30);
  border:1px solid #1e3048;border-radius:14px;
  padding:16px 12px;text-align:center;
  position:relative;overflow:hidden;
  transition:transform .2s,border-color .2s;
}
.nation-card:hover{transform:translateY(-3px);}
.nation-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
/* Borussia Dortmund — yellow/black */
.nc-1::before{background:linear-gradient(90deg,transparent,#fde100,transparent);}
.nc-1:hover{border-color:rgba(253,225,0,0.4);}
/* Paris Saint-Germain — navy/red */
.nc-2::before{background:linear-gradient(90deg,transparent,#004170,transparent);}
.nc-2:hover{border-color:rgba(218,41,28,0.4);}
/* FC Barcelona — garnet/blue */
.nc-3::before{background:linear-gradient(90deg,transparent,#a50044,transparent);}
.nc-3:hover{border-color:rgba(0,77,152,0.4);}
.nation-flag{font-size:2.2rem;display:block;margin-bottom:6px;}
.nation-name{
  font-family:'Bebas Neue',sans-serif;font-size:1rem;
  letter-spacing:0.08em;color:#fff;
}
.nation-sub{
  font-family:'Barlow Condensed',sans-serif;font-size:0.6rem;
  letter-spacing:0.1em;text-transform:uppercase;color:#2d4a65;margin-top:2px;
}

/* season badge */
.season-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(0,200,83,0.08);border:1px solid rgba(0,200,83,0.2);
  border-radius:20px;padding:5px 16px;margin-bottom:20px;
  font-family:'Barlow Condensed',sans-serif;font-size:0.72rem;
  letter-spacing:0.2em;text-transform:uppercase;color:#00c853;
}
.new-dot{width:7px;height:7px;border-radius:50%;background:#00c853;animation:blink 1.2s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.2;}}
</style>
</head>
<body>

<!-- ══ SPLASH ══ -->
<div id="splash">
  <canvas id="pCanvas"></canvas>
  <div class="sp-content">
    <div class="sp-ball-wrap">
      <div class="sp-ring2"></div>
      <div class="sp-ring"></div>
      <div class="sp-ball">⚽</div>
    </div>
    <div class="sp-eyebrow">Welcome to</div>
    <div class="sp-title">FOOTBALL<br/><span class="acc">SYSTEM</span></div>
    <div class="sp-season">Season 7 &nbsp;·&nbsp; Club Teams</div>
    <div class="sp-line"></div>
    <div class="sp-prog-wrap">
      <div class="sp-prog-row"><span>Entering System</span><span id="spPct">0%</span></div>
      <div class="sp-prog-track"><div class="sp-prog-fill" id="spFill"></div></div>
      <div class="sp-dots"><div class="sp-dot"></div><div class="sp-dot"></div><div class="sp-dot"></div></div>
    </div>
  </div>
</div>

<!-- ══ MAIN PAGE ══ -->
<div class="container" style="text-align:center;">
  <div class="season-badge"><span class="new-dot"></span> Season 7 — Club Teams</div>
  <h1>⚽ Football League</h1>

  <!-- ══ CLUB TEAMS STRIP ══ -->
  <div class="nations-strip">
    <div class="nations-label">🌍 Teams</div>
    <div class="nations-grid">

      <div class="nation-card nc-1">
        <span class="nation-flag">🟡⚫</span>
        <div class="nation-name">DORTMUND</div>
        <div class="nation-sub">Club Team</div>
      </div>

      <div class="nation-card nc-2">
        <span class="nation-flag">🔵🔴</span>
        <div class="nation-name">PSG</div>
        <div class="nation-sub">Club Team</div>
      </div>

      <div class="nation-card nc-3">
        <span class="nation-flag">🔴🔵</span>
        <div class="nation-name">BARCELONA</div>
        <div class="nation-sub">Club Team</div>
      </div>

    </div>
  </div>

  <!-- ══ NAV BUTTONS ══ -->
  <div class="buttons">
    <button onclick="location.href='table.html'">🏆 Table</button>
    <button onclick="location.href='matchweek.html'">⚽ Match Week</button>
    <button onclick="location.href='history.html'">📜 History</button>
    <button onclick="location.href='encounters.html'">🤝 Encounters</button>
    <button class="warning-btn" onclick="location.href='card-warning.html'">🟡 Card Warning</button>
    <button class="check-btn" onclick="location.href='check-games.html'">🔍 Check Games</button>
    <button onclick="location.href='injuries.html'" style="border-color:rgba(255,111,0,0.3);">🏥 Injuries</button>
    <button class="admin-btn" onclick="location.href='admin.html'">🔐 Admin</button>
    <button onclick="location.href='betting.html'" style="border-color:rgba(0,200,83,0.4);color:#00c853;">🎰 Betting</button>
    <button onclick="location.href='champions.html'" style="border-color:rgba(255,214,0,0.4);color:#ffd600;">🏆 Champions</button>
    <button onclick="location.href='news.html'" style="border-color:rgba(0,200,83,0.3);color:#00c853;">📰 ئەخبارەکان</button>
    <button onclick="location.href='records.html'" style="border-color:rgba(255,183,77,0.4);color:#ffb74d;">🏅 History Records</button>
  </div>
</div>

<script>
(function(){
  var canvas = document.getElementById("pCanvas");
  var ctx = canvas.getContext("2d");
  var W, H, particles = [];
  function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  resize(); window.addEventListener("resize", resize);
  function rp(){
    return { x:Math.random()*W, y:H+Math.random()*100,
      vx:(Math.random()-.5)*.5, vy:-(0.4+Math.random()*1.2),
      r:1+Math.random()*2.5, alpha:.1+Math.random()*.5,
      color:Math.random()>.6?"#00e676":Math.random()>.5?"#ffd600":"#ffffff" };
  }
  for(var i=0;i<55;i++){ var p=rp(); p.y=Math.random()*H; particles.push(p); }
  function draw(){
    ctx.clearRect(0,0,W,H);
    particles.forEach(function(p){
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=p.color;ctx.globalAlpha=p.alpha;ctx.fill();
      p.x+=p.vx;p.y+=p.vy;p.alpha-=0.0005;
      if(p.y<-10||p.alpha<=0) Object.assign(p,rp());
    });
    ctx.globalAlpha=1;
  }
  var animId;
  function loop(){ animId=requestAnimationFrame(loop); draw(); }
  loop();

  var splash=document.getElementById("splash");
  var fill=document.getElementById("spFill");
  var pctEl=document.getElementById("spPct");
  var DURATION=3000;

  if(sessionStorage.getItem("splashDone7")){
    splash.style.display="none"; cancelAnimationFrame(animId); return;
  }
  var t0=performance.now();
  function tick(now){
    var p=Math.min((now-t0)/DURATION,1);
    var e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    var v=Math.round(e*100);
    fill.style.width=v+"%"; pctEl.textContent=v+"%";
    if(p<1) requestAnimationFrame(tick); else exit();
  }
  requestAnimationFrame(tick);
  function exit(){
    sessionStorage.setItem("splashDone7","1");
    splash.classList.add("exit");
    setTimeout(function(){ splash.style.display="none"; cancelAnimationFrame(animId); },800);
  }
})();
</script>
</body>
</html>
