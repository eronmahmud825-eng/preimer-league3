<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Football League — Season 4</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        .season-badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(0,200,83,0.08); border: 1px solid rgba(0,200,83,0.2);
            border-radius: 20px; padding: 5px 16px; margin-bottom: 20px;
            font-family: 'Barlow Condensed', sans-serif; font-size: 0.72rem;
            letter-spacing: 0.2em; text-transform: uppercase; color: #00c853;
        }
        .new-dot { width: 7px; height: 7px; border-radius: 50%; background: #00c853;
            animation: blink 1.2s ease-in-out infinite; }
        @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:.2;} }
    </style>
</head>
<body>
    <div class="container" style="text-align:center;">
        <div class="season-badge"><span class="new-dot"></span> Season 4 — Fresh Start</div>
        <h1>⚽ Football League</h1>
        <div class="buttons">
            <button onclick="location.href='table.html'">🏆 Table</button>
            <button onclick="location.href='matchweek.html'">⚽ Match Week</button>
            <button onclick="location.href='history.html'">📜 History</button>
            <button onclick="location.href='encounters.html'">🤝 Encounters</button>
            <button class="warning-btn" onclick="location.href='card-warning.html'">🟡 Card Warning</button>
            <button class="check-btn" onclick="location.href='check-games.html'">🔍 Check Games</button>
            <button onclick="location.href='injuries.html'" style="border-color:rgba(255,111,0,0.3);">🏥 Injuries</button>
            <button class="admin-btn" onclick="location.href='admin.html'">🔐 Admin</button>    
            <button onclick="location.href='news.html'" style="border-color:rgba(0,200,83,0.3);color:#00c853;">📰 ئەخبارەکان</button>
            <button onclick="location.href='champions.html'" style="border-color:rgba(255,214,0,0.4);color:#ffd600;">🏆 Champions</button>
        </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="firebase.js"></script>
    <script src="script.js"></script>
</body>
</html>
