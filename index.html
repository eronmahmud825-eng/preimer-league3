<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;700&display=swap');
@keyframes splashIn{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:scale(1);}}
@keyframes ballGlow{0%,100%{filter:drop-shadow(0 0 20px rgba(0,200,83,0.5));}50%{filter:drop-shadow(0 0 50px rgba(0,200,83,1));}}
@keyframes flagWave{0%,100%{transform:perspective(200px) rotateY(0deg);}25%{transform:perspective(200px) rotateY(3deg);}75%{transform:perspective(200px) rotateY(-3deg);}}
@keyframes spinSlow{to{transform:rotate(360deg);}}
@keyframes sunSpin{to{transform:translate(-50%,-50%) rotate(360deg);}}
@keyframes dp{0%,100%{opacity:.3;transform:scale(1);}50%{opacity:1;transform:scale(1.5);}}
</style>

<script>
(function(){
  // Check if already shown this session
  if (sessionStorage.getItem("splashShown")) {
    document.getElementById("splash").style.display = "none";
    return;
  }

  const fill = document.getElementById("splashFill");
  const pct  = document.getElementById("splashPct");
  const DURATION = 3000;
  const startTime = performance.now();

  function tick(now) {
    const progress = Math.min((now - startTime) / DURATION, 1);
    const eased = progress < .5 ? 2*progress*progress : 1 - Math.pow(-2*progress+2,2)/2;
    const val = Math.round(eased * 100);
    fill.style.width = val + "%";
    pct.textContent  = val + "%";
    if (progress < 1) { requestAnimationFrame(tick); }
    else { hideSplash(); }
  }
  requestAnimationFrame(tick);

  function hideSplash() {
    sessionStorage.setItem("splashShown", "1");
    const splash = document.getElementById("splash");
    splash.style.opacity = "0";
    splash.style.transform = "scale(1.04)";
    setTimeout(() => splash.style.display = "none", 700);
  }
})();
</script>
