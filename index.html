/* ══════════════════════════════════════
   SPLASH SCREEN
══════════════════════════════════════ */
#splash {
  position: fixed; inset: 0; z-index: 9999;
  background: #020507;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  overflow: hidden;
}
#splash::before {
  content: '';
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(0,200,83,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,200,83,0.04) 1px, transparent 1px);
  background-size: 60px 60px;
  animation: gridMove 20s linear infinite;
}
@keyframes gridMove { to { background-position: 60px 60px; } }
#splash::after {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse 70% 70% at 50% 50%, transparent 30%, #020507 100%);
  pointer-events: none;
}
#pCanvas { position: absolute; inset: 0; z-index: 0; }

.sp-content {
  position: relative; z-index: 10;
  display: flex; flex-direction: column;
  align-items: center; text-align: center;
  padding: 20px;
  animation: spContentIn 1.2s cubic-bezier(.16,1,.3,1) .1s both;
}
@keyframes spContentIn {
  from { opacity: 0; transform: translateY(30px) scale(.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.sp-ball-wrap { position:relative; width:clamp(80px,18vw,110px); height:clamp(80px,18vw,110px); margin-bottom:20px; }
.sp-ball-ring  { position:absolute;inset:-8px;border-radius:50%;border:1px solid rgba(0,200,83,0.2);animation:ringPulse 2s ease-in-out infinite; }
.sp-ball-ring2 { position:absolute;inset:-18px;border-radius:50%;border:1px solid rgba(0,200,83,0.08);animation:ringPulse 2s ease-in-out .4s infinite; }
@keyframes ringPulse { 0%,100%{transform:scale(1);opacity:.6;}50%{transform:scale(1.06);opacity:1;} }
.sp-ball {
  width:100%;height:100%;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#1a3a28,#030d07);
  border:1px solid rgba(0,200,83,0.3);
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(36px,9vw,56px);
  animation:ballBreathe 3s ease-in-out infinite;
  box-shadow:0 0 40px rgba(0,200,83,0.15),inset 0 0 30px rgba(0,0,0,0.5);
}
@keyframes ballBreathe {
  0%,100%{box-shadow:0 0 30px rgba(0,200,83,0.12),inset 0 0 30px rgba(0,0,0,0.5);}
  50%{box-shadow:0 0 60px rgba(0,200,83,0.28),inset 0 0 30px rgba(0,0,0,0.5);}
}
.sp-eyebrow { font-family:'Barlow Condensed',sans-serif;font-size:clamp(0.65rem,2vw,0.78rem);letter-spacing:0.4em;text-transform:uppercase;color:rgba(0,200,83,0.55);margin-bottom:6px;animation:fadeUp .6s ease .6s both; }
.sp-title { font-family:'Bebas Neue',sans-serif;font-size:clamp(3rem,11vw,6rem);letter-spacing:0.04em;line-height:0.9;color:#fff;animation:fadeUp .7s ease .7s both; }
.sp-title .accent { color:transparent;-webkit-text-stroke:1px rgba(0,200,83,0.7); }
.sp-season { font-family:'Barlow Condensed',sans-serif;font-size:clamp(0.75rem,2.5vw,0.9rem);letter-spacing:0.25em;text-transform:uppercase;color:rgba(255,255,255,0.2);margin-top:6px;margin-bottom:28px;animation:fadeUp .6s ease .8s both; }
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.sp-line { width:clamp(40px,10vw,60px);height:1px;background:linear-gradient(90deg,transparent,rgba(0,200,83,0.4),transparent);margin:0 auto 24px;animation:lineExpand .8s ease .9s both; }
@keyframes lineExpand{from{width:0;opacity:0;}to{opacity:1;}}
.sp-progress-wrap { width:clamp(220px,60vw,340px);animation:fadeUp .6s ease 1.1s both; }
.sp-progress-row { display:flex;justify-content:space-between;font-family:'Barlow Condensed',sans-serif;font-size:0.62rem;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.18);margin-bottom:8px; }
.sp-progress-track { height:2px;background:rgba(255,255,255,0.06);border-radius:1px;overflow:hidden; }
.sp-progress-fill { height:100%;width:0%;background:linear-gradient(90deg,#00c853,#69f0ae);border-radius:1px;transition:width .05s linear; }
.sp-dots { display:flex;justify-content:center;gap:5px;margin-top:10px; }
.sp-dot { width:4px;height:4px;border-radius:50%;background:rgba(0,200,83,0.3);animation:dotPop 1.4s ease-in-out infinite; }
.sp-dot:nth-child(2){animation-delay:.2s;}.sp-dot:nth-child(3){animation-delay:.4s;}
@keyframes dotPop{0%,100%{background:rgba(0,200,83,0.25);transform:scale(1);}50%{background:rgba(0,200,83,0.9);transform:scale(1.6);}}
#splash.exit { animation:splashExit .8s cubic-bezier(.4,0,1,1) forwards; }
@keyframes splashExit{0%{opacity:1;transform:scale(1);}100%{opacity:0;transform:scale(1.03);}}

/* ══════════════════════════════════════
   STADIUM CARDS SECTION
══════════════════════════════════════ */
.stadiums-section {
  max-width: 700px; margin: 0 auto; padding: 0 16px 8px;
}
.stadiums-label {
  font-family:'Barlow Condensed',sans-serif;
  font-size:0.68rem;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;
  color:#2d4a65;margin-bottom:14px;
  display:flex;align-items:center;gap:8px;
}
.stadiums-label::after{content:'';flex:1;height:1px;background:#1e3048;}

.stadiums-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 28px;
}
@media(max-width:560px){
  .stadiums-grid { grid-template-columns: 1fr; gap:10px; }
}

.stad-card {
  position: relative;
  height: 180px;
  border-radius: 16px;
  overflow: hidden;
  cursor: pointer;
  transition: transform .3s cubic-bezier(.16,1,.3,1), box-shadow .3s;
  border: 1px solid rgba(255,255,255,0.06);
}
.stad-card:hover {
  transform: translateY(-6px) scale(1.02);
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}
.stad-card:active { transform: translateY(-2px) scale(1.01); }

.stad-bg {
  position: absolute; inset: 0;
  background-size: cover; background-position: center;
  transition: transform .5s ease;
}
.stad-card:hover .stad-bg { transform: scale(1.07); }

.stad-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(0deg, rgba(4,8,15,0.92) 0%, rgba(4,8,15,0.4) 50%, rgba(4,8,15,0.1) 100%);
}
.stad-overlay2 {
  position: absolute; inset: 0;
  opacity: 0; transition: opacity .3s;
}
.stad-card:hover .stad-overlay2 { opacity: 1; }

.stad-content {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  justify-content: flex-end;
  padding: 14px;
}
.stad-team {
  font-family:'Barlow Condensed',sans-serif;
  font-size:0.58rem;letter-spacing:0.2em;text-transform:uppercase;
  margin-bottom:2px;
}
.stad-name {
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(1.1rem,3vw,1.4rem);
  letter-spacing:0.06em;color:#fff;line-height:1;
}
.stad-city {
  font-family:'Barlow Condensed',sans-serif;
  font-size:0.6rem;letter-spacing:0.1em;text-transform:uppercase;
  color:rgba(255,255,255,0.3);margin-top:3px;
}
.stad-arrow {
  position:absolute;top:12px;right:12px;
  width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:0.7rem;
  opacity:0;transform:scale(0.7);
  transition:all .25s cubic-bezier(.16,1,.3,1);
}
.stad-card:hover .stad-arrow { opacity:1;transform:scale(1); }

<script>
(function(){
  const canvas = document.getElementById("pCanvas");
  const ctx    = canvas.getContext("2d");
  let W, H, particles = [];
  function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  resize(); window.addEventListener("resize", resize);
  function randomParticle(){
    return { x:Math.random()*W, y:H+Math.random()*100, vx:(Math.random()-.5)*.5, vy:-(0.4+Math.random()*1.2), r:1+Math.random()*2.5, alpha:.1+Math.random()*.5, color:Math.random()>.6?"#00e676":Math.random()>.5?"#ffd600":"#ffffff" };
  }
  for(let i=0;i<55;i++){ const p=randomParticle(); p.y=Math.random()*H; particles.push(p); }
  function draw(){
    ctx.clearRect(0,0,W,H);
    particles.forEach(p=>{ ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=p.color;ctx.globalAlpha=p.alpha;ctx.fill();p.x+=p.vx;p.y+=p.vy;p.alpha-=0.0005;if(p.y<-10||p.alpha<=0)Object.assign(p,randomParticle()); });
    ctx.globalAlpha=1;
  }
  let animId;
  function loop(){ animId=requestAnimationFrame(loop); draw(); }
  loop();
  const splash=document.getElementById("splash"),fill=document.getElementById("spFill"),pctEl=document.getElementById("spPct"),DURATION=3000;
  if(sessionStorage.getItem("splashDone5")){ splash.style.display="none"; cancelAnimationFrame(animId); return; }
  const t0=performance.now();
  function tick(now){
    const p=Math.min((now-t0)/DURATION,1);
    const e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    const v=Math.round(e*100);
    fill.style.width=v+"%"; pctEl.textContent=v+"%";
    if(p<1) requestAnimationFrame(tick); else exit();
  }
  requestAnimationFrame(tick);
  function exit(){ sessionStorage.setItem("splashDone5","1"); splash.classList.add("exit"); setTimeout(()=>{ splash.style.display="none"; cancelAnimationFrame(animId); },800); }
})();
</script>
