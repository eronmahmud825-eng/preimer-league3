<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clear All Firebase Data</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        .warn-box { background:#1e0a0a;border:2px solid #f44336;border-radius:12px;padding:20px;margin-bottom:24px;text-align:center; }
        .warn-box h2 { color:#f44336;font-size:1.4rem;margin-bottom:8px; }
        .warn-box p { color:#e57373;font-size:0.92rem;line-height:1.6; }
        .status-line { padding:6px 0;font-size:0.88rem;border-bottom:1px solid #1e3048; }
        .status-line.ok { color:#00c853; }
        .status-line.err { color:#f44336;font-weight:700; }
        .status-line.info { color:#8faac8; }
        #log { margin-top:12px;max-height:320px;overflow-y:auto; }
        .progress-bar { height:6px;background:#1e3048;border-radius:3px;margin-top:12px;overflow:hidden; }
        .progress-fill { height:100%;background:#00c853;border-radius:3px;transition:width 0.3s;width:0%; }
        #clearBtn { background:#c62828 !important;color:#fff !important;font-size:1.05rem;padding:14px;width:100%;margin-top:4px;border:none;border-radius:8px;cursor:pointer;font-family:inherit;font-weight:700;letter-spacing:0.06em;text-transform:uppercase; }
        #clearBtn:hover:not(:disabled) { background:#b71c1c !important; }
        #clearBtn:disabled { opacity:0.45;cursor:not-allowed; }
        #dbStatus { font-size:0.8rem;margin-top:8px;color:#4d6a85; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">🗑️ Clear All Data</h1>

        <div class="warn-box">
            <h2>⚠️ DANGER ZONE</h2>
            <p>This will permanently delete <strong>ALL</strong> data from Firebase:<br/>
            matches · players · suspensions · injuries · reports · table<br/>
            <strong>This cannot be undone!</strong></p>
        </div>

        <div class="form-card">
            <div class="form-container">
                <label>Admin Password
                    <input id="adminPass" type="password" placeholder="Enter admin password" autocomplete="off" />
                </label>
                <label>Type <strong style="color:#f44336;">DELETE ALL</strong> to confirm
                    <input id="confirmText" type="text" placeholder="DELETE ALL" autocomplete="off" />
                </label>
                <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
                <button id="clearBtn" disabled>🗑️ Clear Everything</button>
                <div id="dbStatus">🔌 Connecting to Firebase…</div>
            </div>
        </div>

        <div class="card" id="logCard" style="display:none;">
            <h3>📋 Progress</h3>
            <div id="log"></div>
        </div>

        <div class="btn-row">
            <button class="back-btn" onclick="location.href='index.html'">⬅ Back to Home</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="firebase.js"></script>

    <script>
        // MUST match the passwords in script.js
        const ADMIN_PASSWORD = "123321";
        const SUPER_ADMIN_PASSWORD = "9999";

        const els = {
            pass: document.getElementById("adminPass"),
            confirm: document.getElementById("confirmText"),
            btn: document.getElementById("clearBtn"),
            progress: document.getElementById("progressFill"),
            logCard: document.getElementById("logCard"),
            log: document.getElementById("log"),
            dbStatus: document.getElementById("dbStatus")
        };

        function checkReady() {
            const validPass = (els.pass.value === ADMIN_PASSWORD || els.pass.value === SUPER_ADMIN_PASSWORD);
            const validConfirm = els.confirm.value.trim() === "DELETE ALL";
            els.btn.disabled = !(validPass && validConfirm && window.db);
        }
        els.pass.addEventListener("input", checkReady);
        els.confirm.addEventListener("input", checkReady);

        function addLog(msg, type) {
            els.logCard.style.display = "block";
            const div = document.createElement("div");
            div.className = "status-line " + (type || "info");
            div.textContent = msg;
            els.log.appendChild(div);
            els.log.scrollTop = els.log.scrollHeight;
        }

        function setProgress(pct) { els.progress.style.width = pct + "%"; }

        // Wait for window.db to appear (set by firebase.js)
        function waitForDB() {
            return new Promise(function(resolve, reject) {
                if (window.db) { resolve(window.db); return; }
                let attempts = 0;
                const iv = setInterval(function() {
                    attempts++;
                    if (window.db) { clearInterval(iv); resolve(window.db); }
                    else if (attempts > 50) {
                        clearInterval(iv);
                        reject(new Error("Firebase never initialized (window.db is undefined). Check that firebase.js loaded correctly and your Firebase config is valid."));
                    }
                }, 100);
            });
        }

        waitForDB().then(function() {
            els.dbStatus.textContent = "✅ Firebase connected";
            els.dbStatus.style.color = "#00c853";
            checkReady();
        }).catch(function(err) {
            els.dbStatus.textContent = "❌ " + err.message;
            els.dbStatus.style.color = "#f44336";
        });

        async function deleteCollection(db, colName) {
            const snap = await db.collection(colName).get();
            if (snap.empty) {
                addLog("  → '" + colName + "' is already empty ✓", "ok");
                return;
            }
            const docs = snap.docs;
            for (let i = 0; i < docs.length; i += 400) {
                const chunk = docs.slice(i, i + 400);
                const batch = db.batch();
                chunk.forEach(doc => batch.delete(doc.ref));
                await batch.commit(); // will throw on permission-denied etc — caught by caller
            }
            addLog("  → '" + colName + "': deleted " + docs.length + " record(s) ✓", "ok");
        }

        els.btn.addEventListener("click", async function() {
            els.btn.disabled = true;
            els.btn.textContent = "⏳ Clearing...";
            setProgress(5);
            els.log.innerHTML = "";

            const collections = [
                "matches", "players", "playerSuspensions",
                "playerInjuries", "matchReports", "tableOverrides"
            ];

            try {
                const db = await waitForDB();
                addLog("🔌 Firebase connected", "ok");
                setProgress(10);

                for (let i = 0; i < collections.length; i++) {
                    const colName = collections[i];
                    addLog("Deleting '" + colName + "'...", "info");
                    await deleteCollection(db, colName);
                    setProgress(10 + Math.round(((i + 1) / collections.length) * 88));
                }

                setProgress(100);
                addLog("", "info");
                addLog("🎉 ALL DATA CLEARED SUCCESSFULLY!", "ok");
                addLog("Your database is now completely empty.", "ok");
                addLog("Go to Admin to add new players.", "ok");
                els.btn.textContent = "✅ Done!";
                els.btn.style.background = "#00c853";
                els.btn.style.color = "#000";
            } catch (err) {
                console.error(err);
                addLog("❌ FAILED: " + err.message, "err");
                if (String(err.message).toLowerCase().includes("permission")) {
                    addLog("→ This is almost always a Firestore Security Rules issue — go to the Firebase console → Firestore → Rules, and make sure delete access is allowed for this app.", "err");
                }
                els.btn.disabled = false;
                els.btn.textContent = "🗑️ Retry";
            }
        });
    </script>
</body>
</html>
